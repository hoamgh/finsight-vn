version: 1
contract: daily_market
primary_key:
  - symbol
  - trading_date

required_fields:
  symbol: string
  trading_date: date
  open: decimal
  high: decimal
  low: decimal
  close: decimal
  volume: integer
  source: string
  ingested_at: timestamp

quality_rules:
  - high >= low
  - high >= open
  - high >= close
  - low <= open
  - low <= close
  - volume >= 0

notes:
  - Corporate-action adjustment policy must be explicit per source.
  - Duplicate symbol/trading_date rows are invalid after normalization.
  - Raw provider responses must be retained for replay and reconciliation.
