services:
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    restart: unless-stopped
    env_file:
      - .env.postgres
    ports:
      - "5433:5432"
    volumes:
      - finsight-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  finsight-postgres-data:
